name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Seleziona Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto
        run: xcodegen generate

      - name: Cache dei pacchetti Swift
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build e test (senza firma)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Dillo.xcodeproj -scheme Dillo \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E "Test run|error:|warning:.*Dillo/|\*\* " || true
          grep -q "TEST SUCCEEDED" build/xcodebuild.log

      - name: Nessun warning nel codice di Dillo
        run: |
          # Ogni warning nel codice di Dillo diventa un'annotazione con file e riga, visibile nella pagina della CI.
          warnings=$(grep -E "/Dillo(Tests)?/[^:]+:[0-9]+:[0-9]+: warning:" build/xcodebuild.log | sort -u || true)
          if [ -n "$warnings" ]; then
            echo "$warnings" | while IFS= read -r line; do
              file=$(echo "$line" | sed -E 's#^.*/(Dillo(Tests)?/[^:]+):([0-9]+):([0-9]+): warning: (.*)$#\1#')
              row=$(echo "$line" | sed -E 's#^.*/(Dillo(Tests)?/[^:]+):([0-9]+):([0-9]+): warning: (.*)$#\3#')
              msg=$(echo "$line" | sed -E 's#^.*: warning: (.*)$#\1#')
              echo "::error file=$file,line=$row::$msg"
            done
            exit 1
          fi
